[project]
name = "aifred"
version = "0.1.0"
description = "Personal life-assistant. Local ollama, brain.md memory, gmail+calendar+whatsapp+telegram. Code-first, LLM-last."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "google-auth>=2.53.0",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.197.0",
    "neonize>=0.3.18.post0",
]

[project.scripts]
aifred = "aifred.main:run"
aifred-service = "aifred.service:run_service"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aifred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
