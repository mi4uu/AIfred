[project]
name = "aifred"
version = "0.1.0"
description = "Personal life-assistant. Local ollama, brain.md memory, gmail+calendar+whatsapp+telegram. Code-first, LLM-last."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "google-auth>=2.53.0",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.197.0",
    "neonize>=0.3.18.post0",
]

[project.scripts]
aifred = "aifred.main:run"
aifred-service = "aifred.service:run_service"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=2.4.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aifred"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear (common bug patterns)
    "C4",   # unnecessary comprehensions/list calls
    "SIM",  # flake8-simplify
    "S",    # bandit (security)
    "FURB", # refurb (modernize)
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert is how pytest checks things, not a prod binary
    "RUF001", "RUF002", "RUF003",  # user-facing copy is Polish; en/em dashes and accents are correct there
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]  # test asserts, fixture literals and /tmp paths in fixtures aren't real risks

[tool.mypy]
python_version = "3.11"
packages = ["aifred"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# third-party libs ship no stubs and no py.typed marker; nothing we can fix on our end
module = ["googleapiclient.*", "google_auth_oauthlib.*", "neonize.*"]
ignore_missing_imports = true
